name: AIS update & deploy

on:
  # Every hour, listening 40 minutes each time. The free AIS feed only hears ships near a coast,
  # so listening most of the day catches vessels as they pass in range.
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Update now even if it already ran today'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # App changes (push) deploy right away instead of waiting behind a 20-minute data update.
  group: ais-${{ github.event_name == 'push' && 'deploy' || 'update' }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pull vessel data (AISStream, VesselFinder, carrier APIs)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          VESSELFINDER_API_KEY: ${{ secrets.VESSELFINDER_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          LISTEN_MINUTES: 40
          KUAI_CONTAINERS: ${{ secrets.KUAI_CONTAINERS }}
          MAERSK_CONSUMER_KEY: ${{ secrets.MAERSK_CONSUMER_KEY }}
          MAERSK_CLIENT_SECRET: ${{ secrets.MAERSK_CLIENT_SECRET }}
        run: node scripts/update-ais.mjs
      - name: Commit vessels.json
        run: |
          git config user.name "kuai-bot"
          git config user.email "kuai-bot@users.noreply.github.com"
          git add data/vessels.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "AIS update $(date -u +%Y-%m-%d)"
          # Someone may have pushed while we were listening: rebase on top and retry.
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
